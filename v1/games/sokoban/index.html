<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sokoban</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="page sokoban-page">
    <section class="panel">
      <div class="heading">
        <h1>Sokoban</h1>
        <p>Push payload crates onto target nodes.</p>
      </div>

      <div class="scores">
        <div class="score-card"><span class="label">Level</span><strong id="level">1/3</strong></div>
        <div class="score-card"><span class="label">Moves</span><strong id="moves">0</strong></div>
        <div class="score-card"><span class="label">Pushes</span><strong id="pushes">0</strong></div>
        <div class="score-card"><span class="label">State</span><strong id="status">Pushing</strong></div>
      </div>

      <div class="actions">
        <button id="reset" class="primary-btn" type="button">Reset</button>
        <button id="next" class="primary-btn" type="button">Next</button>
      </div>

      <section class="mobile-controls" aria-label="Sokoban controls">
        <button data-dir="up" type="button">Up</button>
        <div class="control-row">
          <button data-dir="left" type="button">Left</button>
          <button data-dir="down" type="button">Down</button>
          <button data-dir="right" type="button">Right</button>
        </div>
      </section>
    </section>

    <section class="board-wrap">
      <div id="board" class="board" aria-label="Sokoban board"></div>
    </section>
  </main>

  <script src="./game-core.js"></script>
  <script src="./app.js"></script>
</body>
</html>
