<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minesweeper</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="panel">
        <div class="heading">
          <h1>Minesweeper</h1>
          <p>Reveal all safe cells. Right click to flag a mine.</p>
        </div>

        <div class="stats">
          <div class="stat-card">
            <span class="label">Status</span>
            <strong id="status">Playing</strong>
          </div>
          <div class="stat-card">
            <span class="label">Mines Left</span>
            <strong id="mines-left">10</strong>
          </div>
        </div>

        <button id="restart" class="primary-btn" type="button">New Game</button>
      </section>

      <section class="board-wrap">
        <div id="board" class="board" aria-label="Minesweeper board"></div>
      </section>
    </main>

    <script src="./game-core.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
