<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lights Out</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="page lightsout-page">
    <section class="panel">
      <div class="heading">
        <h1>Lights Out</h1>
        <p>Flip a node and its neighbors. Kill every signal.</p>
      </div>

      <div class="scores">
        <div class="score-card">
          <span class="label">Moves</span>
          <strong id="moves">0</strong>
        </div>
        <div class="score-card">
          <span class="label">Grid</span>
          <strong id="status">Lights leaking</strong>
        </div>
      </div>

      <button id="reset" class="primary-btn" type="button">New Grid</button>
    </section>

    <section class="board-wrap">
      <div id="board" class="board" aria-label="Lights Out board"></div>
    </section>
  </main>

  <script src="./game-core.js"></script>
  <script src="./app.js"></script>
</body>
</html>
