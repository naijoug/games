name: Deploy 2048 to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "2048/**"
      - ".github/workflows/deploy-2048-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./2048

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
