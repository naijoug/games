<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Games</title>
    <style>
      :root {
        --bg: #f2f6fb;
        --card: #ffffff;
        --text: #1f2937;
        --sub: #4b5563;
        --accent: #0f766e;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", "Avenir Next", sans-serif;
        color: var(--text);
        background: linear-gradient(180deg, #f7fafc, var(--bg));
      }
      main {
        max-width: 860px;
        margin: 0 auto;
        padding: 40px 16px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: clamp(1.8rem, 4vw, 2.5rem);
      }
      p {
        margin: 0 0 18px;
        color: var(--sub);
      }
      .games {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 14px;
      }
      .card {
        display: block;
        text-decoration: none;
        color: inherit;
        background: var(--card);
        border-radius: 14px;
        padding: 16px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
        border: 1px solid #e5e7eb;
      }
      .card strong {
        display: block;
        font-size: 1.1rem;
      }
      .card span {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Mini Games</h1>
      <p>Choose a game:</p>
      <section class="games">
        <a class="card" href="./2048/">
          <strong>2048</strong>
          <span>Open game</span>
        </a>
        <a class="card" href="./snake/">
          <strong>Snake</strong>
          <span>Open game</span>
        </a>
        <a class="card" href="./tictactoe/">
          <strong>Tic Tac Toe</strong>
          <span>Open game</span>
        </a>
        <a class="card" href="./minesweeper/">
          <strong>Minesweeper</strong>
          <span>Open game</span>
        </a>
        <a class="card" href="./memory/">
          <strong>Memory Match</strong>
          <span>Open game</span>
        </a>
        <a class="card" href="./connect4/">
          <strong>Connect Four</strong>
          <span>Open game</span>
        </a>
        <a class="card" href="./hangman/">
          <strong>Hangman</strong>
          <span>Open game</span>
        </a>
        <a class="card" href="./simon/">
          <strong>Simon</strong>
          <span>Open game</span>
        </a>
        <a class="card" href="./xiangqi/">
          <strong>Xiangqi (Chinese Chess)</strong>
          <span>Open game</span>
        </a>
      </section>
    </main>
  </body>
</html>
